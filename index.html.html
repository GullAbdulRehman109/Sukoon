:root[data-theme="dark"]{--bg:#0F1F1E;--card:#162B29;--ink:#E6F2EF;--mute:#94B3AE;--acc:#5CC2B5;--accink:#0F1F1E;--gold:#E0B65A;--line:#284643;--warn:#3A2A18;--warnink:#F6DDBE}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:600px;margin:0 auto;padding:18px 18px 40px}
.ur{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic","Segoe UI",serif;line-height:2.3}
.en h1,.en h2{font-family:Lora,Georgia,serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:30px;line-height:1.3}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--card);color:var(--mute);padding:8px 14px;font:600 15px system-ui;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--accink)}
.sub{color:var(--mute);margin:6px 0 18px}
textarea{width:100%;height:130px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;resize:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit;font-size:15px;cursor:pointer;line-height:1.6}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.go{width:100%;border:0;border-radius:14px;padding:14px;background:var(--acc);color:var(--accink);font:700 17px system-ui;cursor:pointer}
.priv{font-size:14px;color:var(--mute);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.card h2{font-size:22px;margin-bottom:6px}
.verse{border-inline-start:4px solid var(--gold);padding:2px 14px;margin:14px 0}
.verse b{display:block;color:var(--gold);font-size:15px}
.verse a{color:var(--acc);font-size:14px}
.lbl{font-weight:700;margin-top:14px}
.tr{font-style:italic;color:var(--mute)}
.crisis{background:var(--warn);color:var(--warnink);border-radius:16px;padding:16px;margin-top:16px;font-weight:600}
.cnt{display:flex;align-items:center;gap:14px;margin-top:10px}
.big{width:96px;height:96px;border-radius:50%;border:0;background:var(--acc);color:var(--accink);font:700 30px system-ui;cursor:pointer}
.small{border:0;background:none;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;font-size:15px}
.foot{font-size:14px;color:var(--mute);margin-top:22px}

.pray .nx{font-size:15px;margin:2px 0 10px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;line-height:1.9}

.pg div.on{background:#fff;color:#15302E}
.pg b{display:block;font-size:14px;font-weight:600}
.pg span{font-size:16px;font-weight:700}
.pray .note{font-size:13px;margin-top:10px}
.pray .small{color:#fff;margin-top:4px}
.par{text-align:center;margin-top:22px;padding:16px;border-radius:18px;border:1.5px solid var(--gold);background:var(--card)}
.par b{display:block;color:var(--gold);font-size:19px;margin:4px 0}
body{background:linear-gradient(160deg,var(--bg) 0%,color-mix(in srgb,var(--acc) 24%,var(--bg)) 55%,color-mix(in srgb,var(--gold) 20%,var(--bg)) 100%);background-attachment:fixed;min-height:100vh}
#app{position:relative;z-index:1}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:fl 14s ease-in-out infinite alternate}
.o1{width:320px;height:320px;background:var(--acc);top:-90px;left:-90px}
.o2{width:260px;height:260px;background:var(--gold);top:38%;right:-100px;opacity:.22;animation-delay:-6s}
@keyframes fl{to{transform:translate(30px,40px) scale(1.12)}}
.w{position:absolute;left:0;bottom:0;width:200%;fill:var(--acc);animation:sw 20s linear infinite}
.w1{height:190px;opacity:.16}
.w2{height:150px;opacity:.2;animation-duration:30s;animation-direction:reverse}
.w3{height:110px;opacity:.26;animation-duration:42s}
@keyframes sw{to{transform:translateX(-50%)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.card.t,.crisis{animation:up .5s ease both}
.top h1{background:linear-gradient(90deg,var(--acc),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:34px}
.seg{border-radius:14px;backdrop-filter:blur(8px)}
.card,.pray{box-shadow:0 10px 30px rgba(20,60,55,.14)}
.card{backdrop-filter:blur(12px);border-radius:22px;background:color-mix(in srgb,var(--card) 80%,transparent)}
.card.t{background:color-mix(in srgb,var(--cbg) 86%,transparent)}
textarea{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(10px);border-radius:20px;box-shadow:0 6px 20px rgba(20,60,55,.08)}
textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}
.chip{box-shadow:0 2px 8px rgba(20,60,55,.08);transition:transform .15s}

.go{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#1b4f8a));border-radius:16px;box-shadow:0 8px 22px color-mix(in srgb,var(--acc) 45%,transparent);transition:transform .15s}
.go:hover{transform:translateY(-2px)}
.big{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 65%,#1b4f8a));box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 22%,transparent),0 10px 24px color-mix(in srgb,var(--acc) 40%,transparent)}
.big:active{transform:scale(.94)}
.foot{background:color-mix(in srgb,var(--card) 70%,transparent);border-radius:14px;padding:12px}
@media (prefers-reduced-motion:reduce){.w,.orb,.card.t,.crisis{animation:none}}
</style>

const CR=["suicid","kill myself","end my life","want to die","harm myself","self harm","self-harm","better off dead","خودکشی","مر جانا","مرجانا","جان دے","اپنی جان","زندگی ختم"];
let lang="en",text="",pick=null,res=null,cnt=0,msg="";
const HU={stress:[24,"🌿"],anxiety:[205,"🌊"],sad:[255,"🌙"],lonely:[330,"🤝"],grief:[190,"🕊️"],anger:[4,"🔥"],guilt:[140,"🌱"]};
let geo={lat:30.1575,lng:71.5249,my:false};
const R=Math.PI/180,sn=x=>Math.sin(x*R),cs=x=>Math.cos(x*R),acs=x=>Math.acos(x)/R,fx=(a,b)=>a-b*Math.floor(a/b);
function prayerTimes(d){
 const tz=-d.getTimezoneOffset()/60;
 const jd=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5+2440587.5-geo.lng/360;
 const D=jd+0.5-2451545,g=fx(357.529+0.98560028*D,360),q=fx(280.459+0.98564736*D,360),
 Lg=fx(q+1.915*sn(g)+0.02*sn(2*g),360),e=23.439-3.6e-7*D,
 RA=fx(Math.atan2(cs(e)*sn(Lg),cs(Lg))/R,360)/15,
 dec=Math.asin(sn(e)*sn(Lg))/R;
 let eq=q/15-RA;if(eq>12)eq-=24;if(eq<-12)eq+=24;
 const noon=12+tz-geo.lng/15-eq;
 const h=a=>acs((-sn(a)-sn(dec)*sn(geo.lat))/(cs(dec)*cs(geo.lat)))/15;
 const as=-(Math.atan(1/(2+Math.tan(Math.abs(geo.lat-dec)*R)))/R);
 return [noon-h(18),noon-h(.833),noon+0.0167,noon+h(as),noon+h(.833),noon+h(18)];
}
function ft(t){t=fx(t,24);let H=Math.floor(t),M=Math.round((t-H)*60);if(M===60){H++;M=0}H%=24;return (H%12||12)+":"+String(M).padStart(2,"0")+" "+(H>=12?"PM":"AM")}
function prayerHTML(l,ur){
 const now=new Date(),pt=prayerTimes(now),nh=now.getHours()+now.getMinutes()/60;
 let ni=[0,2,3,4,5].find(k=>pt[k]>nh);if(ni===undefined)ni=0;
 return `<div class="pray ${ur?"ur":""}"><h2>🕌 ${l.pt}</h2><p class="nx">${l.nx}: <b>${l.pn[ni]}</b> <span dir="ltr">${ft(pt[ni])}</span> · ${geo.my?l.myl:l.lc}</p><div class="pg" dir="ltr">${pt.map((t,k)=>`<div class="${k===ni?"on":""}"><b>${l.pn[k]}</b><span>${ft(t)}</span></div>`).join("")}</div><p class="note">${l.pnote}</p><button class="small" id="loc">${l.loc}</button></div>`;
}
function analyze(){
 const q=text.toLowerCase();let best=null,sc=0;
 if(pick)best=T.find(t=>t.id===pick);
 else{T.forEach(t=>{const s=t.k.filter(k=>q.includes(k)).length;if(s>sc){sc=s;best=t}})}
 const crisis=CR.some(k=>q.includes(k));
 if(!best&&!crisis){msg=L[lang].none;res=null;return}
 if(!best&&crisis)best=T.find(t=>t.id==="sad");
 msg="";res={t:best,crisis};
}
function render(){

 let h=`<div class="top ${ur?"ur":""}"><h1>${l.title}</h1><div class="seg" dir="ltr"><button class="${!ur?"on":""}" data-l="en">English</button><button class="${ur?"on":""}" data-l="ur">اردو</button></div></div>
 <p class="sub ${ur?"ur":""}">${l.sub}</p>
 ${prayerHTML(l,ur)}
 <textarea id="tx" class="${ur?"ur":""}" placeholder="${l.ph}" aria-label="${l.ph}">${text.replace(/</g,"&lt;")}</textarea>
 <p class="priv ${ur?"ur":""}">${l.priv}</p>
 <p class="lbl ${ur?"ur":""}">${l.topics}</p>
 <div class="chips ${ur?"ur":""}">${T.map(t=>`<button class="chip ${pick===t.id?"on":""}" data-p="${t.id}" style="--h:${HU[t.id][0]}">${HU[t.id][1]} ${t.h[i]}</button>`).join("")}</div>
 <button class="go ${ur?"ur":""}" id="go" style="line-height:1.6">${l.btn}</button>
 <p class="${ur?"ur":""}" role="alert" style="color:var(--gold);font-weight:700;margin-top:8px">${msg}</p>`;
 if(res){
  const t=res.t,[hu,em]=HU[t.id];
  if(res.crisis)h+=`<div class="crisis ${ur?"ur":""}" role="alert">${l.crisis}</div>`;
  h+=`<div class="card t ${ur?"ur":""}" style="--h:${hu}"><h2>${em} ${t.h[i]}</h2><p>${t.m[i]}</p>

  <p class="lbl">${l.dua}</p><div class="dua"><p class="tr" dir="ltr" style="text-align:${ur?"right":"left"}">${t.d[0]}</p><p>${t.d[i+1]}</p></div>
  <p class="lbl">${l.tip}</p><p>${t.t[i]}</p></div>`;
 }
 h+=`<div class="card ${ur?"ur":""}"><h2>${l.dh}</h2><p>${l.dhs}</p><div class="cnt"><button class="big" id="dh" aria-label="${l.dh}">${cnt}</button><button class="small" id="rs">${l.reset}</button></div></div>
 <p class="foot ${ur?"ur":""}">${l.foot}</p>
 <div class="par ${ur?"ur":""}"><p>${l.par1}</p><b>${l.par2}</b><p>${l.par3}</p></div>`;
 app.innerHTML=h;
 app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{text=document.getElementById("tx").value;lang=b.dataset.l;render()});
 app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{text=document.getElementById("tx").value;pick=pick===b.dataset.p?null:b.dataset.p;render()});
 document.getElementById("go").onclick=()=>{text=document.getElementById("tx").value;analyze();render();if(res)document.querySelector(".card,.crisis").scrollIntoView({behavior:"smooth",block:"start"})};
 document.getElementById("dh").onclick=e=>{cnt++;e.target.textContent=cnt};
 document.getElementById("rs").onclick=()=>{cnt=0;render()};
 document.getElementById("loc").onclick=()=>{if(!navigator.geolocation){msg=l.nl;render();return}navigator.geolocation.getCurrentPosition(p=>{text=document.getElementById("tx").value;geo={lat:p.coords.latitude,lng:p.coords.longitude,my:true};render()},()=>{text=document.getElementById("tx").value;msg=l.nl;render()},{timeout:8000})};
}

</script>
